name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug -PappVersionName="${GITHUB_REF_NAME#v}"

      - name: Rename artifact
        run: mv app/build/outputs/apk/debug/app-debug.apk "AVRRemote-${{ github.ref_name }}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "AVRRemote-${{ github.ref_name }}.apk"
          generate_release_notes: true
